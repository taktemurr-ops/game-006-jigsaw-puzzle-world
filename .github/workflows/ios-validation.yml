name: iOS compile validation
on:
  workflow_dispatch:
  pull_request:
jobs:
  ios-build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS project and resolve
        run: |
          flutter create --platforms=ios --project-name game_006_jigsaw_puzzle_world .
          flutter pub get
      - name: Compile iOS without signing
        run: flutter build ios --debug --no-codesign
